# 爱快 iKuai Q3000 (MT7981B) OpenWrt 云编译 workflow
# 适用仓库: hanwckf/immortalwrt-mt798x (fork 到自己的 GitHub 后使用)
# 使用方法:
#   1. Fork https://github.com/hanwckf/immortalwrt-mt798x 到自己的账号
#   2. 把本文件放到仓库 .github/workflows/build-q3000.yml
#   3. 到 Actions 页选择 "Build iKuai Q3000 OpenWrt" -> Run workflow
#   4. 编译约 40-60 分钟后在 Artifacts 下载固件
name: Build iKuai Q3000 OpenWrt

on:
  workflow_dispatch:
    inputs:
      extra_packages:
        description: '额外预装软件包（空格分隔，如 luci-app-adguardhome luci-app-openclash）'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses5-dev libssl-dev python3 python3-pip \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for iKuai Q3000
        run: |
          cp -f defconfig/mt7981-ax3000.config .config
          # 清掉模板里默认勾选的其他设备，只保留 Q3000，加快编译
          sed -i '/^CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_.*=y$/d' .config
          sed -i '/^CONFIG_TARGET_DEVICE_PACKAGES_mediatek_mt7981_DEVICE_.*=""/d' .config
          cat >> .config <<'EOF'
          CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_ikuai_q3000=y
          CONFIG_TARGET_DEVICE_PACKAGES_mediatek_mt7981_DEVICE_ikuai_q3000=""
          EOF
          # 额外软件包
          for pkg in ${{ github.event.inputs.extra_packages }}; do
            echo "CONFIG_PACKAGE_${pkg}=y" >> .config
          done
          make defconfig

      - name: Build firmware
        run: |
          make -j$(nproc) V=s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ikuai-q3000-firmware
          path: |
            bin/targets/mediatek/mt7981/*-sysupgrade.bin
            bin/targets/mediatek/mt7981/*-factory.bin
            bin/targets/mediatek/mt7981/sha256sums
          retention-days: 7
