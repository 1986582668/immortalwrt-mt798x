# 爱快 iKuai Q3000 (MT7981B, 512MB) OpenWrt 云编译 workflow - 基础验证版
# 适用仓库: hanwckf/immortalwrt-mt798x (fork)
# 设备: ikuai_q3000 (mediatek/mt7981, aarch64_cortex-a53, SPI-NAND NMBM)
# 本版: 去掉 kenzo/small 插件源与科学上网插件，仅保留 ikuai_q3000 + 中文 + Argon，用于验证编译链路
# 软件源: 内置中科大 ImmortalWrt 21.02-SNAPSHOT
# 注意: 固件侧 DTS 的 ubi 分区已对齐 U-Boot default 布局 (0x6e80000=112896k)
name: Build iKuai Q3000 OpenWrt (basic)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses5-dev libssl-dev python3 python3-pip \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for iKuai Q3000
        run: |
          cp -f defconfig/mt7981-ax3000.config .config
          sed -i '/^CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_.*=y$/d' .config
          sed -i '/^CONFIG_TARGET_DEVICE_PACKAGES_mediatek_mt7981_DEVICE_.*=""/d' .config
          echo "CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_ikuai_q3000=y" >> .config
          echo 'CONFIG_TARGET_DEVICE_PACKAGES_mediatek_mt7981_DEVICE_ikuai_q3000=""' >> .config
          echo "# ---- 中文界面 ----" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          echo "# ---- Argon 主题 ----" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          make defconfig

      - name: Embed domestic opkg feeds (USTC 21.02-SNAPSHOT)
        run: |
          mkdir -p files/etc/opkg
          echo "src/gz immortalwrt_core https://mirrors.ustc.edu.cn/immortalwrt/releases/21.02-SNAPSHOT/targets/mediatek/mt7981/packages" > files/etc/opkg/distfeeds.conf
          echo "src/gz immortalwrt_base https://mirrors.ustc.edu.cn/immortalwrt/releases/21.02-SNAPSHOT/packages/aarch64_cortex-a53/base" >> files/etc/opkg/distfeeds.conf
          echo "src/gz immortalwrt_luci https://mirrors.ustc.edu.cn/immortalwrt/releases/21.02-SNAPSHOT/packages/aarch64_cortex-a53/luci" >> files/etc/opkg/distfeeds.conf
          echo "src/gz immortalwrt_packages https://mirrors.ustc.edu.cn/immortalwrt/releases/21.02-SNAPSHOT/packages/aarch64_cortex-a53/packages" >> files/etc/opkg/distfeeds.conf
          echo "src/gz immortalwrt_routing https://mirrors.ustc.edu.cn/immortalwrt/releases/21.02-SNAPSHOT/packages/aarch64_cortex-a53/routing" >> files/etc/opkg/distfeeds.conf
          echo "src/gz immortalwrt_telephony https://mirrors.ustc.edu.cn/immortalwrt/releases/21.02-SNAPSHOT/packages/aarch64_cortex-a53/telephony" >> files/etc/opkg/distfeeds.conf

      - name: Build firmware
        run: |
          make -j$(nproc) V=s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ikuai-q3000-firmware-basic
          path: |
            bin/targets/mediatek/mt7981/*-sysupgrade.bin
            bin/targets/mediatek/mt7981/*-factory.bin
            bin/targets/mediatek/mt7981/sha256sums
          retention-days: 7
