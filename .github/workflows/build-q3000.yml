# 爱快 iKuai Q3000 (MT7981B) OpenWrt 云编译 workflow —— 带插件+中文+Argon+中科大源
# 适用仓库: hanwckf/immortalwrt-mt798x (fork 到自己的 GitHub 后使用)
# 配置:
#   设备: ikuai_q3000 (mediatek/mt7981, aarch64_cortex-a53)
#   插件: AdGuardHome / WOL / DDNS / Samba4 / ttyd
#   界面: 中文 + Argon 主题
#   软件源: 内置中科大 ImmortalWrt 21.02-SNAPSHOT
# 使用:
#   1. Fork https://github.com/hanwckf/immortalwrt-mt798x 到自己的账号
#   2. 把本文件放到仓库 .github/workflows/build-q3000.yml
#   3. 到 Actions 页选择 "Build iKuai Q3000 OpenWrt (plugins)" -> Run workflow
#   4. 编译约 40-60 分钟后在 Artifacts 下载固件
name: Build iKuai Q3000 OpenWrt (plugins)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses5-dev libssl-dev python3 python3-pip \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Add third-party feed (adguardhome luci)
        run: |
          echo "src-git kenzok8 https://github.com/kenzok8/openwrt-packages.git;master" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for iKuai Q3000 with plugins
        run: |
          cp -f defconfig/mt7981-ax3000.config .config
          sed -i '/^CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_.*=\\y$/d' .config
          sed -i '/^CONFIG_TARGET_DEVICE_PACKAGES_mediatek_mt7981_DEVICE_.*=""/d' .config
          cat >> .config <<'EOF'
          CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_ikuai_q3000=y
          CONFIG_TARGET_DEVICE_PACKAGES_mediatek_mt7981_DEVICE_ikuai_q3000=""
          # ---- 插件 ----
          CONFIG_PACKAGE_luci-app-adguardhome=y
          CONFIG_PACKAGE_luci-app-wol=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_luci-app-samba4=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          # ---- 中文界面 ----
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          # ---- Argon 主题 ----
          CONFIG_PACKAGE_luci-theme-argon=y
          EOF
          make defconfig

      - name: Embed domestic opkg feeds (USTC 21.02-SNAPSHOT)
        run: |
          mkdir -p files/etc/opkg
          cat > files/etc/opkg/distfeeds.conf <<'EOF'
          src/gz immortalwrt_core https://mirrors.ustc.edu.cn/immortalwrt/releases/21.02-SNAPSHOT/targets/mediatek/mt7981/packages
          src/gz immortalwrt_base https://mirrors.ustc.edu.cn/immortalwrt/releases/21.02-SNAPSHOT/packages/aarch64_cortex-a53/base
          src/gz immortalwrt_luci https://mirrors.ustc.edu.cn/immortalwrt/releases/21.02-SNAPSHOT/packages/aarch64_cortex-a53/luci
          src/gz immortalwrt_packages https://mirrors.ustc.edu.cn/immortalwrt/releases/21.02-SNAPSHOT/packages/aarch64_cortex-a53/packages
          src/gz immortalwrt_routing https://mirrors.ustc.edu.cn/immortalwrt/releases/21.02-SNAPSHOT/packages/aarch64_cortex-a53/routing
          src/gz immortalwrt_telephony https://mirrors.ustc.edu.cn/immortalwrt/releases/21.02-SNAPSHOT/packages/aarch64_cortex-a53/telephony
          EOF

      - name: Build firmware
        run: |
          make -j$(nproc) V=s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ikuai-q3000-firmware-plugins
          path: |
            bin/targets/mediatek/mt7981/*-sysupgrade.bin
            bin/targets/mediatek/mt7981/*-factory.bin
            bin/targets/mediatek/mt7981/sha256sums
          retention-days: 7
